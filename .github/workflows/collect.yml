name: 手动采集小红书公开页面
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collect-public-notes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install -r collector/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect publicly readable text
        run: python collector/run.py
      - name: Save results and coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: firefly-feedback-${{ github.run_number }}
          path: output/*.json
          retention-days: 7
          if-no-files-found: warn
